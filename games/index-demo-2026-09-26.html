<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AO GAMES // HOUSE & MOUNT</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{background:#04050a;color:#e8e6d9;font-family:JetBrains Mono;margin:0;padding:96px 20px 40px}
h1{color:#d8ae55;letter-spacing:.15em}
.card{border:1px solid #d8ae55;border-radius:16px;padding:20px;background:#080A12;max-width:960px;margin:20px auto}
.btn{border:1px solid #d8ae55;color:#d8ae55;background:rgba(216,174,85,.1);padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:700;letter-spacing:.1em}
.badge{display:inline-block;border:1px solid #00eaff;color:#00eaff;border-radius:999px;padding:4px 10px;margin-right:8px;font-size:11px}
</style>
</head>
<body>
<script src="../ao-bridge.js"></script>
<h1>SANCTUARY // PLAY GAMES</h1>
<div id="status" class="card">Loading House...</div>
<div class="card"><span class="badge" id="houseBadge">HOUSE -</span><span class="badge" id="mountBadge">MOUNT -</span><span class="badge" id="coins">AC -</span></div>
<div class="card">
<h3>House 1 • Pixel & Dot • Demo World</h3>
<p>Reads house/mount from URL or localStorage. Replace this with your real canvas.</p>
<button class="btn" onclick="launch()">LAUNCH WORLD →</button>
<canvas id="game" width="800" height="450" style="width:100%;margin-top:20px;background:#0a0c14;border:1px solid #222;border-radius:12px"></canvas>
</div>
<script>
function getSel(){
  var p=new URLSearchParams(location.search);
  var house=p.get('house')||localStorage.getItem('anom_selectedHouse')||'1';
  var mount=p.get('mount')||localStorage.getItem('anom_selectedMount')||'aurora';
  var coins=localStorage.getItem('anom_coins')||'340';
  var name=localStorage.getItem('anom_selectedHouseName')||'Pixel & Dot';
  return {house, mount, coins, name};
}
function render(){
  var s=getSel();
  document.getElementById('houseBadge').textContent='HOUSE '+s.house;
  document.getElementById('mountBadge').textContent='MOUNT '+s.mount.toUpperCase();
  document.getElementById('coins').textContent=s.coins+' AC';
  document.getElementById('status').innerHTML='<div style="color:#d8ae55;font-size:11px;letter-spacing:.2em">AO UNIVERSE → SANCTUARY</div><div style="font-size:20px;font-weight:800">Welcome '+s.name+'</div><div style="opacity:.7">House '+s.house+' • '+s.mount+' • '+s.coins+' AC</div>';
}
function launch(){
  var s=getSel();
  var c=document.getElementById('game'), ctx=c.getContext('2d');
  ctx.fillStyle='#080A12'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#d8ae55'; ctx.font='16px JetBrains Mono'; ctx.fillText('WORLD LOADED: House '+s.house+' Mount '+s.mount,20,40);
  ctx.fillStyle='#00eaff'; ctx.fillText(s.coins+' AC • Ready to fly',20,70);
  // TODO: replace with your real game init -> initGame({house:s.house, mount:s.mount})
}
render();
</script>
</body>
</html>
